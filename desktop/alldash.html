<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading-Bot – Dashboard (alle)</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="icon" href="icon.png">
  <style>
    [hidden] { display: none !important; }
    html, body { height: 100%; } body { display: flex; flex-direction: column; overflow: hidden; }
    #tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; } #tabs button { padding: 9px 18px; border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; white-space: nowrap; }
    #tabs button.active { color: var(--fg); background: var(--bg); border-color: var(--line); font-weight: 600; margin-bottom: -1px; }
    #all { flex: 1; overflow: auto; padding: 12px 14px 24px; } #frames { flex: 1; position: relative; } iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); } iframe.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .k { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; } .k small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; } .k strong { font-size: 18px; } .k .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; } .box h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 5px 7px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; } th:first-child, td:first-child, td.l, th.l { text-align: left; } th { color: var(--muted); font-weight: 500; font-size: 11px; }
    .wrap { overflow-x: auto; } .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); } .dot.on { background: var(--ok); } .dot.bad { background: var(--bad); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); } .sig { color: var(--ok); font-weight: 700; }
    canvas { width: 100%; height: 200px; display: block; } .warn2 { padding: 8px 12px; border-radius: 8px; background: rgba(192,57,43,.14); border: 1px solid var(--bad); margin-bottom: 12px; }
    @media (max-width: 700px) { #all { padding: 8px 8px 20px; } .k strong { font-size: 15px; } }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="all"></div>
  <div id="frames" hidden></div>
  <script src="__alldash.js" type="module"></script>
</body>
</html>
